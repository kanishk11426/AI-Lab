<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Fine Calculator</title>
</head>
<body>

    <h1>Library Fine Calculator</h1>

    <!-- Input section -->
    <label for="daysInput">Enter number of overdue days:</label>
    <input type="number" id="daysInput" placeholder="e.g. 5">
    <button id="calculateBtn">Calculate Fine</button>

    <!-- Output section -->
    <h2>Results:</h2>
    <p id="validationMessage"></p>
    <p id="fineCategory"></p>
    <p id="countdownMessage"></p>

    <!-- Link to the external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
